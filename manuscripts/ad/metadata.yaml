abstract: 'Background: Reproducibility of gene-set summaries depends on the measurement, contrast and identifier
  unit, not simply matching totals. Methods: We recovered the publisher-hosted Supplementary Table 2 for an Alzheimer-related
  neuronal study (DOI: 10.1038/s41398-020-00882-7), froze a source-column interpretation after prior outcome exposure,
  and reconstructed within-treatment ribosome-enriched versus total RNA lists using literal gene names. We audited
  duplicate identifiers and performed subset-only sensitivity analyses. Results: The workbook contained 2,980 vehicle
  and 3,760 amyloid-beta selected rows, but 2,973 and 3,752 distinct gene names. Literal-name comparison yielded
  349 vehicle-only, 1,128 amyloid-beta-only and 2,624 shared names, compared with reported summaries of 356, 1,136
  and 2,624. Seven and eight excess rows respectively account arithmetically for the differences in unique-category
  totals, without resolving the original identifier-level membership. Conclusions: A recoverable distinction between
  selected rows and gene names changes reconstruction while preserving the reported overlap. This does not establish
  a scientific error or overturn the biological findings. Independent interpretation, original identifiers and cross-case
  evaluation remain necessary.'
