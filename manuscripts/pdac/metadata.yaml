abstract: Published translational-efficiency lists can be computationally recoverable without making the underlying
  inference reproducible. We examined the publicly supplied pancreatic-cancer rapamycin table from Nguyen et al.,
  separating list reconstruction from model refitting and biological interpretation. A post-exposure plan fixed
  seven supplied-q thresholds, literal-identifier checks, effect-magnitude bands and endpoint mapping before new
  calculations. Direct workbook parsing recovered 1815 selected entries and the reported 473 down/588 up entries
  at q<0.01. Tightening q<0.05 to q<0.01 retained 58.46% overall, 54.94% down and 61.64% up. The less-stringent-only
  band contained 754 entries, including 163 with absolute log2 TE effects at least 2. Two repeated gene symbols
  occurred in opposing directions despite distinct Ensembl identifiers. No signed-effect conflict occurred at the
  literal-ID level. The source separately measured early footprint-derived TE, metabolic labeling, reporters, viability
  and colony growth; these endpoints cannot be merged into one therapeutic-effect estimate. This partial reconstruction
  supports source-list consistency and identifies annotation and interpretation hazards. It does not reconstruct
  the full tested universe, identify the correction algorithm, refit RiboDiff, establish Figure 1F membership identity
  or validate clinical efficacy.
