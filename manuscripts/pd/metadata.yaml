abstract: 'Objective: To determine which published LRRK2 mouse-brain translation-efficiency results are recoverable
  from a public processed table, without claiming replication of sequencing or biological experiments. Methods:
  We independently implemented log-ratio reconstruction and membership verification across three contrasts, preserved
  a previously frozen population-standard-deviation primary analysis, and distinguished inherited sample-SD sensitivity
  from new post-hoc universe and structure analyses. Results: All 26,713 supplied rows supported reconstruction.
  Source z-scores matched sample-SD standardization within 1.5 × 10⁻¹³. Source memberships were GS 687 up/335 down,
  GSDA 313/631, and KO 596/576; population-SD primary GS membership retained 688 up, with Eif2b3 crossing the boundary.
  Table sample SDs were 0.216484, 0.173744, and 0.272763 versus caption values 0.226, 0.179, and 0.273. Fixed universe
  alternatives did not reconcile GS/GSDA SDs. Structure-stratum directions were compatible with the source narrative,
  but denominators differed and gene-wide GS–KO changes were not inversely correlated. Conclusions: The processed
  arithmetic and selected memberships are recoverable; the SD and structure-universe correspondence remains unresolved.
  This is a partial computational replication candidate, not evidence of original-study failure, biological replication,
  or clinical benefit.'
